name: Bug report
description: agent-guard crashed, failed open, or behaved differently from the docs.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the hook event JSON or the command, and the relevant lines of events.jsonl (rule ids and hashes only).
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: agent-guard version, Python version, OS, and the client and its version.
